name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest → NSIS exe（x64）；macos-latest → DMG（Apple Silicon arm64）；ubuntu-latest → AppImage（Linux 通用单文件包）
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 官方 Debian/Ubuntu 构建依赖（https://tauri.app/start/prerequisites/）；
      # rusqlite bundled、reqwest 走 rustls，无需 libsqlite3-dev，libssl-dev 按官方清单保留
      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri build 会先跑 beforeBuildCommand（pnpm build = vue-tsc 严格检查 + vite build），
      # 再按 bundle.targets 出当前平台的安装包（NSIS / DMG / AppImage，各平台只构自己支持的格式），
      # 最后建草稿 Release 并挂附件。
      # 注意：tagName 必须显式传（action.yml 无默认值），否则只构建不建 Release。
      - name: Build & create release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ai-teacher v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
